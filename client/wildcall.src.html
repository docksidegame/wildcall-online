<title>Wildcall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: one-screen app. A field-guide table: sage meadow ground, plum trainer accent; cards are physical objects with their own fixed type colors. Duel = opponent bar / opp field / mid strip / your field / your bar / hand. */
:root{
  --bg:#e6efe9; --bg2:#d6e4dc; --panel:#ffffff; --panel2:#f1f6f3; --ink:#17262c; --dim:#566b73; --line:#c3d3ca;
  --accent:#6a3d9a; --accent-ink:#ffffff; --gold:#c98e0c; --heart:#d8434f; --good:#2f9e5b;
  --display:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --card:"Bree Serif","Roboto Slab",Georgia,serif;
  --shadow:0 10px 28px rgba(23,38,44,.14);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1916; --bg2:#14221d; --panel:#1a2a24; --panel2:#21342d; --ink:#e7f0eb; --dim:#93aaa0; --line:#2d4239;
  --accent:#b58ae6; --accent-ink:#1b0f29; --gold:#f2c14a; --heart:#ff6b75; --good:#5fd08d; --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1916; --bg2:#14221d; --panel:#1a2a24; --panel2:#21342d; --ink:#e7f0eb; --dim:#93aaa0; --line:#2d4239;
  --accent:#b58ae6; --accent-ink:#1b0f29; --gold:#f2c14a; --heart:#ff6b75; --good:#5fd08d; --shadow:0 10px 28px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
#app{height:100%;display:flex;flex-direction:column;
  background:radial-gradient(ellipse 90% 60% at 50% 0%,var(--bg2),transparent 70%),var(--bg)}
#main{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
p{margin:0;line-height:1.5}
.eyebrow{font-family:var(--display);font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.btn{border:0;border-radius:999px;padding:11px 22px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
.btn.gold{background:var(--gold);color:#2a1d02;box-shadow:0 3px 0 color-mix(in srgb,var(--gold) 55%,#000)}
.btn.sm{padding:7px 14px;font-size:14px}
.btn[disabled]{opacity:.4;pointer-events:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.screen{flex:1;min-height:0;overflow:auto;padding-block:20px 40px;display:flex;flex-direction:column;align-items:center;gap:20px}
.wrap{width:100%;max-width:980px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topnav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topnav h2{flex:1;font-size:26px}
.coins{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.coins i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,#e3a913 60%,#9a6b00);box-shadow:0 0 0 1px #7a5300 inset}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel);font-weight:700;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip svg{width:14px;height:14px}
.muted{color:var(--dim)}

/* ---------- TCG card (forest frame, cream panels, gold trim; holo = foil edge + navy frame) ---------- */
.tcg{--tc:#8a8a8a;--fr:#26463a;--fr2:#3f6c57;--gd:#d9b45e;--gd2:#9c7429;--cr:#f5f0e0;--cr2:#ebe3cb;--ink2:#172327;
  position:relative;width:var(--cw,150px);aspect-ratio:63/88;height:calc(var(--cw,150px) * 88 / 63);flex:none;font-size:calc(var(--cw,150px) * .068);border-radius:.55em;padding:.34em;
  background:linear-gradient(160deg,var(--fr2),var(--fr) 42%,#183026);box-shadow:0 .35em .9em rgba(0,0,0,.3),0 0 0 .06em rgba(0,0,0,.45);
  color:var(--ink2);font-family:var(--card);user-select:none;transition:transform .16s ease,box-shadow .16s ease;cursor:pointer}
.cf{position:relative;height:100%;border-radius:.34em;box-shadow:0 0 0 .09em var(--gd) inset;padding:.3em;display:flex;flex-direction:column;gap:.26em}
.stud{position:absolute;width:.5em;height:.5em;background:linear-gradient(135deg,#fff3c4,var(--gd) 50%,var(--gd2));transform:rotate(45deg);z-index:3;box-shadow:0 0 0 .05em #5a4318}
.stud.tl{top:-.2em;left:-.2em}.stud.tr{top:-.2em;right:-.2em}.stud.bl{bottom:-.2em;left:-.2em}.stud.br{bottom:-.2em;right:-.2em}
.panel-c,.c-head,.c-body,.c-foot.sep{background:linear-gradient(var(--cr),var(--cr2));border-radius:.3em;box-shadow:0 0 0 .1em var(--gd) inset,0 .08em 0 rgba(0,0,0,.25)}
.c-head{padding:.24em .45em .28em;display:flex;flex-direction:column;gap:.08em}
.c-meta{display:flex;justify-content:space-between;gap:.4em;font-size:.6em;letter-spacing:.07em;text-transform:uppercase;color:#2f4a44;line-height:1.15;white-space:nowrap;overflow:hidden}
.c-meta .hl{color:#6a3d9a}
.c-title{display:flex;align-items:center;gap:.28em;line-height:1}
.c-name{flex:1;min-width:0;font-size:1.5em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.c-name.long{font-size:1.24em}
.c-hp{font-size:1.55em;white-space:nowrap;letter-spacing:-.02em}
.c-hp small{font-size:.42em;margin-right:.14em;letter-spacing:.02em}
.c-med{width:1.65em;height:1.65em;flex:none;border-radius:50%;box-shadow:0 0 0 .12em #c49b5c,0 0 0 .21em #4e3818}
.c-med svg{width:100%;height:100%;display:block}
.c-art{position:relative;height:43%;flex:none;padding:.14em;background:linear-gradient(135deg,#fff1bd,var(--gd) 45%,var(--gd2));
  clip-path:polygon(.6em 0,calc(100% - .6em) 0,100% .6em,100% calc(100% - .6em),calc(100% - .6em) 100%,.6em 100%,0 calc(100% - .6em),0 .6em)}
.c-art>.pic{object-fit:cover}
.c-art>svg,.c-art>.pic{width:100%;height:100%;display:block;clip-path:polygon(.5em 0,calc(100% - .5em) 0,100% .5em,100% calc(100% - .5em),calc(100% - .5em) 100%,.5em 100%,0 calc(100% - .5em),0 .5em)}
.c-type{position:absolute;left:.55em;bottom:.5em;display:flex;align-items:center;gap:.3em;padding:.14em .6em .14em .18em;border-radius:.32em;background:#1f3a30;box-shadow:0 0 0 .1em var(--gd);color:#f5f0e0;font-size:.68em;letter-spacing:.1em;text-transform:uppercase;line-height:1.3}
.c-type.nt{padding-left:.6em}
.c-type svg{width:1.35em;height:1.35em}
.c-band{align-self:center;margin-top:-.95em;position:relative;z-index:2;display:flex;align-items:center;gap:.35em;padding:.18em .8em;border-radius:.3em;background:#1e2a3c;box-shadow:0 0 0 .1em var(--gd),0 .1em .3em rgba(0,0,0,.4);font-size:.68em;letter-spacing:.1em;text-transform:uppercase;color:#f5f0e0;white-space:nowrap;line-height:1.3}
.c-band svg{width:1.35em;height:1.35em}
.c-band::before,.c-band::after{content:"✦";color:var(--gd);font-size:.9em}
.c-body{flex:1;min-height:0;padding:.3em .45em .25em;display:flex;flex-direction:column;gap:.2em}
.tc-kw{display:flex;gap:.25em;flex-wrap:wrap}
.kwp{font-family:var(--body);font-size:.66em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:.12em .5em;border-radius:.3em;background:#1f3a30;color:#f5f0e0}
.tc-moves{flex:1;display:flex;flex-direction:column;justify-content:center;gap:.28em;min-height:0}
.mv{display:flex;align-items:center;gap:.4em;line-height:1.08}
.mv+.mv{border-top:.06em solid rgba(23,35,39,.15);padding-top:.25em}
.mv .cost{display:flex;gap:.06em;flex:none;min-width:2.3em}
.mv .cost i,.spk{display:inline-block;width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6c8,#f2c230 55%,#b07e00);box-shadow:0 0 0 .07em #8a6200 inset,0 .05em .1em rgba(0,0,0,.3);position:relative;flex:none}
.mv .cost i::after,.spk::after{content:"";position:absolute;inset:22%;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.mv .mvn{flex:1;min-width:0}
.mv .mvn b{font-weight:400;font-size:1.18em;display:block;letter-spacing:-.01em}
.mv .mvn em{font-family:var(--body);font-style:normal;font-size:.72em;color:#4a5157;display:block;line-height:1.18;margin-top:.1em}
.mv .dmg{font-size:1.85em;min-width:1em;text-align:right;letter-spacing:-.03em}
.c-text{flex:1;min-height:0;overflow:hidden;font-family:var(--body);font-size:.9em;line-height:1.32;padding:.15em 0;color:#2a3035}
.c-lbl{font-family:var(--body);font-size:.62em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#6b7a76}
.c-note{font-family:var(--body);font-size:.64em;color:#5b6168;margin-top:auto;padding-top:.3em}
.tcg.proto .c-body{gap:.25em}
.tcg.proto .c-text{flex:0 0 auto}
.pill.land{cursor:pointer;color:var(--ink);gap:6px}
.pill.land svg{width:15px;height:15px}
.pill.land.ready{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer;color:var(--dim)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.step{display:inline-flex;align-items:center;gap:6px}
.step button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);cursor:pointer;font-weight:800;line-height:1}
.step b{min-width:22px;text-align:center;font-family:var(--display);font-variant-numeric:tabular-nums}
.coach{display:flex;flex-direction:column;gap:10px}
.grade{display:flex;gap:12px;align-items:center}
.grade>div{display:flex;flex-direction:column}
.grade b{font-family:var(--display);font-size:18px}
.gl{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;color:#fff;flex:none}
.g-A{background:var(--good)}.g-B{background:#5a9e3f}.g-C{background:var(--gold)}.g-D{background:#e07a3a}.g-F{background:var(--heart)}
.cchecks{display:flex;flex-direction:column;gap:7px}
.cc{display:flex;gap:9px;align-items:flex-start;font-size:13px;line-height:1.35}
.cc b{display:block;font-size:13.5px}
.cc span{color:var(--dim)}
.cdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:4px}
.cdot.good{background:var(--good)}.cdot.warn{background:var(--gold)}.cdot.bad{background:var(--heart)}
.sugg{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;line-height:1.35}
.sugg b{display:block;font-size:13.5px}
.sugg span{color:var(--dim)}
.simres{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;line-height:1.4}
.bars{display:flex;gap:4px}
.bars i{flex:1;height:12px;border-radius:3px}
.bars i.w{background:var(--good)}.bars i.l{background:var(--heart)}
@media (max-width:700px){.decklist{order:-1}}
.duel.duel{overflow-y:auto;overflow-x:hidden;grid-template-rows:auto auto auto auto auto auto;grid-template-columns:minmax(0,1fr)}
.duel>*{min-width:0}
.board{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:16px;padding-block:2px;width:100%}
.board .activeRow{order:0}.board .bench{order:1}
.activeRow{position:relative;display:flex;justify-content:center;flex:none}
.activeRow .zone{display:none}
.unit.au{width:132px;max-width:none;box-shadow:0 0 0 2px #f2c230,0 6px 16px rgba(0,0,0,.25)}
.bench{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;flex:0 1 500px;min-width:0}
.bench>*{min-width:0}
.unit.bu{width:100%;padding:3px;border-radius:9px}
.unit.bu .u-in{padding:3px;gap:2px}
.unit.bu .u-name{font-size:10.5px}
.unit.bu .u-hp{height:10px}.unit.bu .u-hp span{font-size:9px;line-height:10px}
.unit.bu .u-spk i,.unit.bu .u-spk .tci{width:8px;height:8px}
.slot.as{width:132px;aspect-ratio:5/6;max-width:none}
.slot.bs{aspect-ratio:5/6;max-width:none;width:100%}
.tci{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.tci svg{width:100%;height:100%;display:block}
.mv .cost .tci{width:1em;height:1em}
.spk.ph{opacity:.55;filter:grayscale(.6)}
.prz{display:inline-flex;gap:2px}
.prz i{width:7px;height:10px;border-radius:2px;background:#4a2a78;box-shadow:0 0 0 1px #e9dcf7 inset}
@media (max-width:720px){
 .board{flex-direction:column;gap:6px}
 .board.opp .bench{order:0}.board.opp .activeRow{order:1}
 .bench{width:100%;flex:none;gap:4px}
 .unit.au,.slot.as{width:104px}
 .unit.bu .u-name{font-size:8.5px}.unit.bu .u-name svg{width:9px;height:9px}
 .unit.bu .u-tags .tag{font-size:8px;padding:1px 4px}
}
.pkg{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.pkg .dl-row{cursor:default}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:.4em;font-size:.68em;color:#22333a;white-space:nowrap;border-top:.08em solid rgba(23,35,39,.22);padding-top:.25em;margin-top:auto}
.c-foot.sep{border-top:0;margin-top:0;padding:.25em .55em}
.c-foot span{display:flex;align-items:center;gap:.25em}
.c-foot svg{width:1.3em;height:1.3em}
.c-gem{width:1.1em;height:1.1em;transform:rotate(45deg);background:linear-gradient(135deg,#ffffff,#b9a4ff 40%,#7fe0ff 70%,#ffd36e);box-shadow:0 0 0 .12em var(--gd),0 0 .5em rgba(185,164,255,.8)}
.rar{font-size:1.05em;line-height:1}
.tcg.trainer{--tc:#7b8794}
.tcg.holo{background:linear-gradient(115deg,#ff9ad5,#ffd36e 18%,#9bf0a8 34%,#7fd8ff 50%,#b49bff 66%,#ff9ad5 82%,#ffd36e);background-size:300% 300%;animation:foil 7s linear infinite}
.tcg.holo .cf{background:linear-gradient(#22304a,#1a2436);}
.tcg.holo .c-body{background:none;box-shadow:none;padding:0;gap:.3em}
.tcg.holo .tc-moves{gap:.3em}
.tcg.holo .mv{background:linear-gradient(var(--cr),var(--cr2));border-radius:.3em;box-shadow:0 0 0 .1em var(--gd) inset;padding:.3em .45em;border-top:0;flex:1}
@keyframes foil{to{background-position:300% 0}}
.tcg.apex{background:linear-gradient(115deg,#ffe9a3,#f2c230 20%,#ff9ad5 38%,#7fd8ff 56%,#b49bff 74%,#ffe9a3);background-size:300% 300%;animation:foil 6s linear infinite;box-shadow:0 .35em 1em rgba(0,0,0,.35),0 0 0 .08em #8a6200,0 0 .8em rgba(242,193,48,.45)}
.tcg.apex .cf{background:linear-gradient(#2a2214,#1a1610);box-shadow:0 0 0 .12em #f2c230 inset}
.tcg.apex .c-band{background:#3a2a0c;color:#ffe9a3}
.tcg.v-prism .c-art::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;mix-blend-mode:color-dodge;opacity:.55;
  background:conic-gradient(from 0deg at 30% 30%,#ff6bd5,#ffd36e,#7dffb0,#6bd8ff,#b48bff,#ff6bd5);background-size:200% 200%;animation:prism 5s linear infinite}
@keyframes prism{to{background-position:200% 100%}}
.tcg.v-full .cf,.tcg.v-alt .cf{background-size:cover;background-position:center}
.tcg.v-full .c-art,.tcg.v-alt .c-art{visibility:hidden}
.tcg.v-full .c-band,.tcg.v-alt .c-band{visibility:visible}
.tcg.v-full .c-head,.tcg.v-alt .c-head,.tcg.v-full .mv,.tcg.v-alt .mv,.tcg.v-full .c-foot.sep,.tcg.v-alt .c-foot.sep{background:rgba(245,240,224,.86);backdrop-filter:blur(2px)}
.tcg.v-alt::before{content:"";position:absolute;inset:0;border-radius:.55em;pointer-events:none;z-index:2;box-shadow:0 0 0 .16em #ffe9a3 inset}
.unit.apexu{background:linear-gradient(115deg,#ffe9a3,#f2c230 25%,#ff9ad5 45%,#7fd8ff 65%,#b49bff 85%);background-size:300% 300%;animation:foil 6s linear infinite}
.tcg.v-prism{background:conic-gradient(from 0deg,#ff6bd5,#ffd36e,#7dffb0,#6bd8ff,#b48bff,#ff6bd5);background-size:200% 200%;animation:prism 5s linear infinite}
.tcg .tc-moves{overflow:hidden}
.tcg.holo .mv{min-height:0;overflow:hidden;flex:1 1 auto}
.tcg .tc-moves,.tcg .c-text{font-size:calc(var(--fit,1) * 1em)}
.tcg.apex .mv .mvn b{font-size:1.02em;line-height:1.02}
.tcg.holo .mv .mvn em{font-size:.6em;line-height:1.1}
.mv .cost{flex-wrap:wrap;max-width:3.2em;row-gap:.08em}
.apx{font-style:normal;color:#c98e0c;margin-right:.2em}
.mv .mvn em strong{color:#8a5a00;font-weight:800}
.c-text.t2{font-size:.8em;line-height:1.25}.c-text.t3{font-size:.7em;line-height:1.22}
.varrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;justify-items:center}
.varrow .vcell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px}
.tcg.r-r .c-art::after,.tcg.holo .c-art::after{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(115deg,transparent 20%,rgba(255,255,255,.9) 35%,rgba(120,220,255,.6) 45%,rgba(255,140,220,.6) 55%,transparent 70%);background-size:250% 100%;animation:holo 4s linear infinite}
@keyframes holo{from{background-position:120% 0}to{background-position:-120% 0}}
.tcg.sil{filter:grayscale(1) brightness(.92);opacity:.42}
.tcg .badge{position:absolute;top:-.6em;right:-.5em;min-width:2em;height:2em;padding:0 .5em;border-radius:1em;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:.95em;display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:4}
.tcg .badge.new{background:#e8572e;color:#fff}
.back{width:var(--cw,150px);aspect-ratio:63/88;border-radius:9px;flex:none;
  background:radial-gradient(circle at 50% 50%,#8a5cc4 0 18%,transparent 19%),repeating-conic-gradient(from 0deg at 50% 50%,#3b2160 0 10deg,#4a2a78 10deg 20deg);
  box-shadow:0 4px 10px rgba(0,0,0,.25),0 0 0 4px #e9dcf7 inset,0 0 0 5px #3b2160 inset;display:grid;place-items:center}
.back svg{width:38%}

/* ---------- duel ---------- */
.duel{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr auto 1fr auto auto;gap:6px;padding-block:8px 6px;max-width:1100px;width:100%;margin:0 auto}
.pbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.avatar{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--line)}
.avatar svg{width:100%;height:100%}
.pname{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.05}
.pname small{display:block;font-family:var(--body);font-size:11.5px;color:var(--dim);font-weight:700}
.heart{display:flex;align-items:center;gap:5px;font-family:var(--display);font-weight:700;font-size:20px;color:var(--heart);font-variant-numeric:tabular-nums;padding:3px 12px 3px 8px;border-radius:999px;background:var(--panel);border:1.5px solid color-mix(in srgb,var(--heart) 40%,var(--line))}
.heart svg{width:18px;height:18px}
.pill{display:flex;align-items:center;gap:5px;font-weight:800;font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill b{color:var(--ink)}
.pill.ready{color:#7a5600;border-color:#e3b53a;background:color-mix(in srgb,#f2c230 22%,var(--panel))}
.pill.used{opacity:.55}
.minibacks{display:flex}
.minibacks i{width:13px;height:18px;border-radius:2px;background:#4a2a78;box-shadow:0 0 0 1px #e9dcf7 inset;margin-left:-5px}
.minibacks i:first-child{margin-left:0}
.field{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:center;justify-items:center;min-height:0;padding-block:4px}
.slot{width:100%;max-width:150px;aspect-ratio:5/6;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;color:var(--dim);font-size:12px;font-weight:700}
.slot.open{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent);cursor:pointer;animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{background:color-mix(in srgb,var(--accent) 18%,transparent)}}
.unit{--tc:#888;position:relative;width:100%;max-width:150px;border-radius:12px;padding:5px;cursor:pointer;
  background:linear-gradient(160deg,#3f6c57,#26463a 42%,#183026);
  box-shadow:0 0 0 1.5px #d9b45e inset,0 5px 14px rgba(0,0,0,.25);transition:transform .25s ease,filter .25s,box-shadow .2s}
.unit.holo{background:linear-gradient(115deg,#ff9ad5,#ffd36e 25%,#9bf0a8 45%,#7fd8ff 65%,#b49bff 85%);background-size:300% 300%;animation:foil 7s linear infinite}
.u-in{border-radius:8px;background:linear-gradient(#f5f0e0,#ebe3cb);box-shadow:0 0 0 1.5px #d9b45e inset;padding:4px;display:flex;flex-direction:column;gap:3px;color:#1d2124}
.u-art{position:relative;border-radius:5px;box-shadow:0 0 0 1.5px #d9b45e;overflow:hidden;aspect-ratio:6/5}
.u-art svg,.u-art .pic{width:100%;height:100%;display:block;object-fit:cover}
.avatar .pic,.act .av .pic,.pack .pa .pic{width:100%;height:100%;display:block;object-fit:cover;aspect-ratio:1}
.u-name svg{width:13px;height:13px;flex:none}
.u-name{font-family:var(--card);font-weight:400;font-size:12.5px;align-items:center;line-height:1;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.u-name small{font-family:var(--body);font-weight:800;font-size:9px;letter-spacing:.06em;color:#6b7176;text-transform:uppercase;align-self:center}
.u-hp{position:relative;height:13px;border-radius:7px;background:#e3dfd6;overflow:hidden}
.u-hp b{position:absolute;inset:0 auto 0 0;border-radius:7px;background:linear-gradient(#5fd08d,#2f9e5b);transition:width .35s}
.u-hp b.mid{background:linear-gradient(#ffd166,#e0a100)}
.u-hp b.low{background:linear-gradient(#ff8a8a,#d8434f)}
.u-hp span{position:relative;display:block;text-align:center;font-family:var(--display);font-weight:700;font-size:10.5px;line-height:13px;font-variant-numeric:tabular-nums}
.u-spk{display:flex;gap:2px;min-height:11px;flex-wrap:wrap}
.u-spk .spk{width:11px;height:11px}
.u-tags{position:absolute;top:-8px;left:-6px;right:-6px;display:flex;justify-content:space-between;pointer-events:none}
.tag{font-family:var(--display);font-weight:600;font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 2px 5px rgba(0,0,0,.25)}
.tag.stun{background:#e2a80c;color:#2a1d02}
.tag.steady{background:#5f8f9e;color:#fff}
.tag.sear{background:#e8572e;color:#fff}
.tag.new{background:#5a6f78;color:#fff}
.unit.exh{transform:rotate(7deg) scale(.94);filter:saturate(.45) brightness(.92)}
.unit.targetable{box-shadow:0 0 0 3px var(--accent),0 0 18px color-mix(in srgb,var(--accent) 60%,transparent);animation:bob 1s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.unit.canact{box-shadow:0 0 0 2.5px #f2c230,0 5px 14px rgba(0,0,0,.2)}
.unit.hit{animation:shake .35s ease}
@keyframes shake{20%{transform:translateX(6px)}40%{transform:translateX(-5px)}60%{transform:translateX(3px)}}
.unit.lunge-up{animation:lup .38s ease}
.unit.lunge-down{animation:ldn .38s ease}
@keyframes lup{45%{transform:translateY(-34px) scale(1.06)}}
@keyframes ldn{45%{transform:translateY(34px) scale(1.06)}}
.mid{display:flex;align-items:center;gap:10px;min-height:38px;flex-wrap:wrap}
.logline{flex:1;min-width:0;font-size:13.5px;color:var(--dim);display:flex;flex-direction:column;gap:1px;max-height:40px;overflow:hidden}
.logline div:first-child{color:var(--ink);font-weight:700}
.turnchip{font-family:var(--display);font-weight:600;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.turnchip.mine{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.hand{--cw:112px;position:relative;height:calc(var(--cw) * 88 / 63 + 10px);display:flex;justify-content:center;align-items:flex-end}
.hand .tcg{margin-left:var(--ov,8px)}
.hand .tcg:first-child{margin-left:0}
.hand .tcg.sel{transform:translateY(-38%) scale(1.55);z-index:20;box-shadow:0 16px 36px rgba(0,0,0,.35),0 0 0 3px var(--accent)}
.hand .tcg.dim{filter:saturate(.55) brightness(.92)}
@media (hover:hover){.hand .tcg:not(.sel):hover{transform:translateY(-14px);z-index:10}}
.hint{font-size:13px;font-weight:700;color:var(--accent);text-align:center;min-height:18px}
.banner{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:70;font-family:var(--display);font-weight:700;font-size:clamp(22px,4vw,34px);padding:10px 26px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:0 12px 30px rgba(0,0,0,.35);animation:ban 1.1s ease forwards;white-space:nowrap;pointer-events:none}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-62%)}}
.float{position:fixed;font-family:var(--display);font-weight:700;font-size:28px;transform:translate(-50%,-50%);animation:fup .95s ease-out forwards;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.float.dmg{color:#fff;-webkit-text-stroke:1.5px #b3202c;paint-order:stroke fill}
.float.heal{color:#5fd08d;font-size:22px}
.float.info{color:#fff;font-size:15px;background:rgba(23,38,44,.85);padding:2px 10px;border-radius:999px;text-shadow:none}
.float.ko{color:#fff;background:#d8434f;font-size:18px;padding:3px 12px;border-radius:999px;text-shadow:none}
@keyframes fup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}18%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-150%)}}

/* sheets / modals */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,18,16,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;overflow:auto;
  padding-block:max(20px,env(safe-area-inset-top,0px)) 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal .panel{max-width:640px;width:100%;margin:auto}
.sheet{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.sheet .tcg{--cw:min(230px,62vw);cursor:default}
.acts{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.act{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);cursor:pointer;transition:border-color .15s}
.act:hover{border-color:var(--accent)}
.act[disabled]{opacity:.45;pointer-events:none}
.act b{font-family:var(--display);font-weight:600;font-size:16px;display:block}
.act span{font-size:13px;color:var(--dim)}
.act .big{margin-left:auto;font-family:var(--display);font-weight:700;font-size:22px}
.act .av{width:46px;height:40px;border-radius:8px;overflow:hidden;flex:none}
.act .av svg{width:100%;height:100%}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.gloss div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--dim)}
.gloss b{display:block;color:var(--ink);font-family:var(--display);font-weight:600;font-size:15px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;max-width:min(440px,92vw);text-align:center;box-shadow:var(--shadow);animation:tin .2s ease}
@keyframes tin{from{opacity:0;transform:translate(-50%,-6px)}}

/* title */
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding-block:24px}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(54px,11vw,104px);line-height:.85;letter-spacing:-.01em;color:var(--ink)}
.logo span{color:var(--accent)}
.fan{display:flex;justify-content:center;height:clamp(150px,28vw,220px);align-items:flex-end}
.fan .tcg{--cw:clamp(98px,17vw,142px);margin:0 -14px;cursor:default}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:min(440px,100%)}
.menu .btn{width:100%}
.tagline{color:var(--dim);max-width:46ch}



/* finishes: non-holo (matte) and foil */
.tcg.r-r.fin-nh .c-art::after{display:none}
.tcg.r-r.fin-foil:not(.holo){background:linear-gradient(115deg,#ff9ad5,#ffd36e 18%,#9bf0a8 34%,#7fd8ff 50%,#b49bff 66%,#ff9ad5 82%,#ffd36e);background-size:300% 300%;animation:foil 7s linear infinite}
.tcg.holo.fin-nh{background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 78%,#fff),color-mix(in srgb,var(--tc) 72%,#000));animation:none;box-shadow:0 .35em .9em rgba(0,0,0,.3),0 0 0 .06em rgba(0,0,0,.45)}
.tcg.holo.fin-nh .cf{background:linear-gradient(#efe5c9,#e4d5b0);box-shadow:0 0 0 .09em #b08a45 inset}
.tcg.holo.fin-nh .c-art::after,.tcg.holo.fin-nh .c-art::before{display:none}
.tcg.holo.fin-nh .c-band{background:color-mix(in srgb,var(--tc) 62%,#1d1d1d);color:#fff;box-shadow:0 0 0 .1em #b08a45,0 .1em .3em rgba(0,0,0,.3)}
.tcg.holo.fin-nh .c-gem{background:#c49a4c;box-shadow:0 0 0 .12em #7d5a1e}
.tcg.holo.fin-nh .c-foot.sep{color:#2a2a22}
.varrow.two{grid-template-columns:repeat(2,minmax(0,1fr))}


/* gallery */
.menu .btn.wide2{grid-column:1/-1}
.galbar{display:flex;flex-direction:column;gap:10px}
.galq{font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);max-width:360px}
.galgrid{--gw:150px}
.galcell{display:flex;flex-direction:column;align-items:center;gap:4px}
.galno{font-size:11px;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.06em}
.viewer{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:color-mix(in srgb,var(--bg) 88%,#000);backdrop-filter:blur(6px);overflow-y:auto;animation:tin .18s ease}
.v-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:1100px;width:100%;margin:0 auto}
.v-count{font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--dim)}
.v-main{position:relative;display:flex;align-items:center;max-width:1100px;width:100%;margin:0 auto;flex:none}
.v-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;flex:1;min-width:0;overscroll-behavior-x:contain}
.v-track::-webkit-scrollbar{display:none}
.v-slide{flex:0 0 100%;scroll-snap-align:center;display:flex;justify-content:center;align-items:center;padding:6px 0 14px;min-height:calc(min(380px,72vw,58vh) / .716 + 20px)}
.v-slide .tcg.gbig{--cw:min(380px,72vw,58vh);cursor:default}
.v-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:48px;height:48px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);font-size:30px;line-height:1;cursor:pointer;box-shadow:var(--shadow);display:grid;place-items:center;padding-bottom:4px}
.v-nav.prev{left:8px}.v-nav.next{right:8px}
.v-nav:disabled{opacity:.3;cursor:default}
.v-info{max-width:640px;width:calc(100% - 32px);margin:4px auto 28px}
.gd-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gd-stats span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.gd-stats small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700}
.gd-stats b{font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:4px}.gd-stats b svg{width:18px;height:18px}
.gd-text{font-size:17px;line-height:1.5}.gd-fl{font-style:italic;color:var(--dim)}
.gd-fin{gap:6px}
@media (max-width:560px){.v-nav{width:40px;height:40px;font-size:24px}.v-nav.prev{left:2px}.v-nav.next{right:2px}}

.tcg.v-full.trainer .c-body,.tcg.v-full.trainer .c-head{background:rgba(245,240,224,.88);backdrop-filter:blur(2px)}
.tcg.v-full.trainer .c-art{visibility:hidden}
.mullhand{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}
.mullhand .tcg{cursor:default}
button.pill.swapbtn{cursor:pointer;font:inherit}
button.pill.swapbtn.ready{border-color:var(--accent);color:var(--accent)}
button.pill.swapbtn:disabled{cursor:default}
/* pack opening (dark wild scene) */
.bo-scene{flex:1;min-height:100%;color:#f2ead3;background:radial-gradient(ellipse at 50% 38%,#1d3827 0%,transparent 55%),radial-gradient(ellipse at 10% 0%,#17322a 0%,transparent 50%),#071812;display:flex;flex-direction:column;align-items:center;padding:14px 16px 28px;overflow:auto;--gold2:#d8b76e}
.bo-scene.k-premium{background:radial-gradient(ellipse at 50% 38%,#3a3417 0%,transparent 55%),radial-gradient(ellipse at 10% 0%,#17322a 0%,transparent 50%),#0b1510}
.bo-scene.k-apex{background:radial-gradient(ellipse at 50% 38%,#4a2412 0%,transparent 55%),radial-gradient(ellipse at 10% 0%,#2a1a12 0%,transparent 50%),#120b08}
.bo-top{width:100%;max-width:1000px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid #bad7bd1c}
.bo-label{font-size:11px;letter-spacing:.18em;font-weight:700;color:#a4b6a9;text-align:center}.bo-label b{color:#e0e5d5;font-weight:600}
.btn.bo-ghost{color:#ccd6c9;box-shadow:0 0 0 1.5px #a0ba9e40 inset;background:transparent}
.btn.bo-ghost:hover{box-shadow:0 0 0 1.5px var(--gold2) inset;color:#f2ead3}
.bo-stage{height:min(520px,62vh);min-height:400px;width:100%;max-width:640px;position:relative;isolation:isolate;perspective:1100px;display:grid;place-items:center}
.bo-floor{position:absolute;width:330px;height:45px;bottom:4px;background:radial-gradient(ellipse,#020b06aa,transparent 70%);filter:blur(6px);transform:rotate(-5deg)}
.bo-orbit{position:absolute;width:390px;height:390px;border:1px solid #c9c08d13;border-radius:50%;transform:rotateX(68deg);bottom:-80px;pointer-events:none}
.bo-orbit:after{content:'';position:absolute;inset:25px;border:1px solid #c9c08d0e;border-radius:50%}
.bo-pack{--pw:min(300px,58vh*.625,70vw);position:relative;width:var(--pw);aspect-ratio:5/8;z-index:3;transform:rotate(-5deg) rotateY(-7deg);filter:drop-shadow(20px 22px 22px #0008);transition:transform .4s;touch-action:pan-y;user-select:none;cursor:pointer}
.bo-pack:hover,.bo-pack.dragging,.bo-pack.tearing{transform:rotate(-2deg) rotateY(3deg) translateY(-5px)}
.bo-pack.dragging{touch-action:none}
.bo-shell{position:absolute;inset:0;background-image:var(--wrapper);background-size:100% 100%;will-change:transform,opacity;backface-visibility:hidden}
.bo-shell:after{content:'';position:absolute;inset:0;background:linear-gradient(112deg,transparent 28%,#fffc 38%,#a6e9df44 43%,transparent 56%);mix-blend-mode:soft-light;background-size:270% 100%;opacity:.5;animation:bofoil 6s ease-in-out infinite;pointer-events:none}
.bo-shell.left{clip-path:polygon(0 10%,6% 9.7%,11% 10.4%,16% 9.7%,22% 10.3%,28% 9.7%,34% 10.3%,40% 9.7%,46% 10.3%,50% 10%,52% 29%,48% 39%,52% 49%,48% 61%,52% 73%,49% 85%,50% 100%,0 100%)}
.bo-shell.right{clip-path:polygon(50% 10%,54% 9.7%,60% 10.3%,66% 9.7%,72% 10.3%,78% 9.7%,84% 10.3%,90% 9.7%,95% 10.3%,100% 10%,100% 100%,50% 100%,49% 85%,52% 73%,48% 61%,52% 49%,48% 39%,52% 29%)}
.bo-shell.strip{clip-path:polygon(0 0,100% 0,100% 10%,95% 10.3%,90% 9.7%,84% 10.3%,78% 9.7%,72% 10.3%,66% 9.7%,60% 10.3%,54% 9.7%,50% 10%,46% 10.3%,40% 9.7%,34% 10.3%,28% 9.7%,22% 10.3%,16% 9.7%,11% 10.4%,6% 9.7%,0 10%);transform-origin:100% 10%}
.bo-tear{position:absolute;left:0;top:8%;width:100%;height:4%;overflow:visible;z-index:4;pointer-events:none}
.bo-tear path{stroke:#fff1c7;stroke-width:1.4;fill:none;stroke-dasharray:100;stroke-dashoffset:100;filter:drop-shadow(0 0 3px #ffcd52);opacity:0}
.bo-ribbon{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:4;font-size:11px;letter-spacing:.24em;font-weight:800;color:#2a1d02;background:linear-gradient(90deg,#c9a24c,#f7e3a0,#c9a24c);padding:6px 14px;border-radius:4px;box-shadow:0 2px 10px #0007;white-space:nowrap}
.k-apex .bo-ribbon{background:linear-gradient(90deg,#c2441c,#ffcf6b,#c2441c)}
.bo-hint{position:absolute;right:4%;top:44px;z-index:5;pointer-events:none;white-space:nowrap;font-size:9px;letter-spacing:.1em;color:#e6d2a7;background:#0c211be8;padding:9px 12px;border:1px solid #d5bb7a55;border-radius:25px;transform:rotate(-5deg)}
.bo-hint:before{content:'←';font-size:15px;margin-right:8px}
.bo-stage.opening .bo-shell.strip{animation:bostrip .8s cubic-bezier(.3,.15,.6,1) forwards}
.bo-stage.opening .bo-shell.left{animation:bopeelL 1.15s cubic-bezier(.3,.1,.7,.8) forwards}
.bo-stage.opening .bo-shell.right{animation:bopeelR 1.15s cubic-bezier(.3,.1,.7,.8) forwards}
.bo-stage.opening .bo-tear,.bo-stage.opening .bo-ribbon,.bo-stage.opening .bo-hint,.bo-stage.unsealed .bo-hint{display:none}
.bo-stack{--sw:min(280px,56vh*.714,66vw);width:var(--sw);aspect-ratio:63/88;position:absolute;left:50%;top:50%;transform:translate(-50%,-44%) rotate(3deg) scale(.95);z-index:2;opacity:0;transition:transform 1.1s cubic-bezier(.2,.65,.25,1),opacity .4s;pointer-events:none}
.bo-stack.visible{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.bo-card{position:absolute;inset:0;perspective:1400px;transition:transform .4s,opacity .35s;cursor:pointer;transform:translate(calc(var(--i)*2px),calc(var(--i)*-2px)) rotate(calc(var(--i)*1deg));filter:drop-shadow(5px 14px 15px #0007)}
.bo-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .72s cubic-bezier(.2,.6,.2,1)}
.bo-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:4.5%;overflow:hidden}
.bo-back svg{width:100%;height:100%;display:block}

.dl-row b{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dl-row .n{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.dl-row .x{color:var(--dim);font-weight:800}
.count{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.count.ok{color:var(--good)}
.warn{font-size:13px;font-weight:700;color:var(--heart)}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.deckcard{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:16px;background:var(--panel);border:1.5px solid var(--line);box-shadow:var(--shadow)}
.deckcard.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.deckcard h3{font-size:20px}
input.name{border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--panel2);font-family:var(--display);font-size:18px;font-weight:600;min-width:0;flex:1}

/* packs */
.packs{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;align-items:center}
.pack{position:relative;width:200px;aspect-ratio:5/8;border-radius:10px;cursor:pointer;overflow:hidden;
  background:linear-gradient(135deg,#6a3d9a,#c04f8a 45%,#f2a541 80%,#6a3d9a);
  clip-path:polygon(0 3%,5% 0,10% 3%,15% 0,20% 3%,25% 0,30% 3%,35% 0,40% 3%,45% 0,50% 3%,55% 0,60% 3%,65% 0,70% 3%,75% 0,80% 3%,85% 0,90% 3%,95% 0,100% 3%,100% 97%,95% 100%,90% 97%,85% 100%,80% 97%,75% 100%,70% 97%,65% 100%,60% 97%,55% 100%,50% 97%,45% 100%,40% 97%,35% 100%,30% 97%,25% 100%,20% 97%,15% 100%,10% 97%,5% 100%,0 97%);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:26px 14px;color:#fff;transition:transform .2s;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.pack:hover{transform:translateY(-6px) rotate(-1.5deg)}
.pack::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:250% 100%;animation:holo 3s linear infinite;pointer-events:none}
.pack .pl{font-family:var(--display);font-weight:700;font-size:40px;line-height:.9;text-shadow:0 3px 0 rgba(0,0,0,.25)}
.pack .ps{font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.pack .pa{width:80%;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.2);box-shadow:0 0 0 4px rgba(255,255,255,.5)}
.pack.tear{animation:tear .5s ease forwards}
@keyframes tear{to{transform:translateY(-40px) scale(1.1);opacity:0}}
.reveal{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;perspective:1000px}
.flip{--cw:160px;width:var(--cw);aspect-ratio:63/88;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.3,1);cursor:pointer;animation:deal .45s ease backwards}
.flip.open{transform:rotateY(180deg);cursor:default}
.flip>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .tcg{transform:rotateY(180deg);--cw:160px}
.flip .back{--cw:160px}
.flip.rare:not(.open) .back{box-shadow:0 0 0 4px #e9dcf7 inset,0 0 0 5px #3b2160 inset,0 0 26px 6px rgba(242,193,48,.85)}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(-8deg)}}

@media (max-width:700px){
  .editor{grid-template-columns:1fr}
  .decklist{position:static}
}
@media (max-width:640px){
  .hand{--cw:74px}
  .hand .tcg.sel{transform:translateY(-52%) scale(2.1)}
  .field{gap:6px}
  .u-name{font-size:10px}
  .u-name small{display:none}
  .u-hp{height:11px}.u-hp span{font-size:9px;line-height:11px}
  .u-spk .spk{width:8px;height:8px}
  .avatar{width:34px;height:34px}
  .pname{font-size:14px}
  .heart{font-size:17px}
  .pill{font-size:11px;padding:3px 8px}
  .grid{--gw:104px;gap:12px 8px}
  .flip,.flip .tcg,.flip .back{--cw:104px}
  .pack{width:160px}
  .topnav h2{font-size:22px}
  .duel{gap:4px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

function wsOpen(){if(WS&&WS.readyState<2)return WS;WS=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');

 WS.onclose=()=>{const was=WS;WS=null;if(D&&D.net&&!D.over&&UI.screen==='duel'){toast('Connection lost. Reconnecting…');setTimeout(()=>{if(!WS)wsOpen()},1500)}else if(RK.queued){RK.queued=false;render()}};return WS}
function wsSend(o){const s=JSON.stringify(o);const w=wsOpen();if(w.readyState===1)w.send(s);else WSQ.push(s)}
function wsClose(){if(WS){try{WS.close()}catch(e){}WS=null}}
function netSend(a,args){if(D&&D.net){D.busy=true}wsSend({t:'act',a,args});return true}
let NET_ORIG=null;
function netPatch(on){if(on&&!NET_ORIG){NET_ORIG={summon,attach,evolve,retreat,playLand,activateLand,swapCard,playTrainer,attack,endTurn};
  summon=(pi,a,b)=>netSend('summon',[a,b]);attach=(pi,a,b)=>netSend('attach',[a,b]);evolve=(pi,a,b)=>netSend('evolve',[a,b]);retreat=(pi,a)=>netSend('retreat',[a]);
  playLand=(pi,a)=>netSend('playLand',[a]);activateLand=(pi,o)=>netSend('activateLand',[JSON.stringify(o)]);swapCard=(pi,a)=>netSend('swapCard',[a]);
  playTrainer=async(pi,a,b)=>netSend('playTrainer',[a,b]);attack=async(pi,a,b,c)=>netSend('attack',[a,b,c]);endTurn=async()=>{if(D&&D.net&&D.turn===0)netSend('endTurn',[]);return true}}
 else if(!on&&NET_ORIG){({summon,attach,evolve,retreat,playLand,activateLand,swapCard,playTrainer,attack,endTurn}=NET_ORIG);NET_ORIG=null}}
let NETMATCH=null,NETPROMPT=null;
function onNet(m){
 if(m.t==='queued'){RK.queued=true;RK.since=Date.now();if(UI.screen==='ranked')render();return}
 if(m.t==='maint'){setMaintState(m);return}
 if(m.t==='chcode'){RK.ch=m.code;RK.queued=false;if(UI.screen==='ranked')render();return}
 if(m.t==='chgone'){RK.ch=null;if(m.msg)toast(m.msg);if(UI.screen==='ranked')render();return}
 if(m.t==='unqueued'){RK.queued=false;if(m.msg)toast(m.msg);if(UI.screen==='ranked')render();return}
 if(m.t==='err'){toast(m.msg);if(D&&D.net){D.busy=D.turn!==0;render()}return}
 if(m.t==='match'){RK.queued=false;RK.ch=null;NETMATCH=m;netPatch(true);closeModal();return}
 if(m.t==='state'){if(!NETMATCH)return;netPatch(true);const prev=D&&D.net?D:null;D=m.view;D.sel=prev&&prev.sel!=null&&D.p[0].hand.some(h=>h.uid===prev.sel)?prev.sel:null;D.snipe=prev?prev.snipe:null;
  const o=NETMATCH.opp||{};D.oppInfo=o.bot?`Bot · ${o.title||'practice'}`:o.friendly?`Friendly · rating ${o.rating||'?'}`:`Rating ${o.rating||'?'}${NETMATCH.stake?` · Stakes ${NETMATCH.stake}`:''}`;D.oppSig=o.sig||'zapkit';D.deadline=m.ms!=null?Date.now()+m.ms:null;
  LOG=m.view.log||[];FXQ=(m.fx||[]).slice();if(UI.screen!=='duel'){UI.screen='duel'}render();flushFx();return}
 if(m.t==='prompt'){if(NETPROMPT)return;NETPROMPT=m.id;promptChoice(m.title,m.sub,m.opts).then(val=>{wsSend({t:'choice',id:m.id,val});NETPROMPT=null});return}
 if(m.t==='promptgone'){if(NETPROMPT===m.id){NETPROMPT=null;CHOICE=null;closeModal()}return}
 if(m.t==='over'){netPatch(false);NETPROMPT=null;CHOICE=null;closeModal();if(m.save){SAVE=m.save;ensureSave();ensureShop()}if(m.user)ACCOUNT=m.user;UI.pvp=m;NETMATCH=null;RK.board=null;RK.hist=null;
  setTimeout(()=>{UI.screen='pvpresult';render()},D&&D.over?1200:0);return}
}

/* ---------- choices: player prompt or AI pick ---------- */
async function choose(pi,title,sub,opts,aiPick,optional){if(!opts.length)return null;
 if(D.p[pi].ai)return aiPick?aiPick(opts):opts[0].val;

 if(list.length===1)return list[0].val;

const cardOpt=(id,extra)=>({label:C[id].n,sub:extra||(isUnit(id)?`${C[id].hp} HP · ${C[id].stage?(isApex(id)?'Apex':'Stage '+C[id].stage):'Basic'}`:isEnergy(id)?'Energy':isLand(id)?'Land':C[id].kind==='ally'?'Ally':'Item'),art:artFor(id),val:id});
function keepValue(pi,id){const p=D.p[pi];
 if(isLand(id))return p.land===id?0.5:p.land?1.5:3;
 if(isEnergy(id)){if(isSpark(id))return 4;const fitsAny=units(pi).some(u=>fits(id,u))||p.hand.some(h=>isUnit(h.id)&&ETYPE[id]===C[h.id].type);return fitsAny?(energyInHand(pi).length>3?1.5:3.5):0.3}
 if(isEvo(id)){const base=C[id].from;return units(pi).some(u=>u.id===base)?4.5:p.hand.some(h=>h.id===base)?3:1}
 if(isBasic(id))return p.field.filter(Boolean).length>=6?1:3.5+(p.field[0]?0:3);
 return (TRAINER_VAL[id]||2)}
function aiWorst(pi,opts){return opts.slice().sort((a,b)=>keepValue(pi,a.val)-keepValue(pi,b.val))[0].val}
async function discardFromHand(pi,n,why){const p=D.p[pi];const out=[];for(let k=0;k<n;k++){const id=await choose(pi,`Discard a card${n>1?` (${k+1} of ${n})`:''}`,why,p.hand.map(h=>({...cardOpt(h.id),val:h.uid})),opts=>{const ids=opts.map(o=>({...o,val:p.hand.find(h=>h.uid===o.val).id}));const w=aiWorst(pi,ids);return p.hand.find(h=>h.id===w).uid});
  const h=p.hand.find(x=>x.uid===id);if(!h)break;p.hand.splice(p.hand.indexOf(h),1);p.discard.push(h.id);out.push(h.id)}
 if(out.length)log(`${pn(pi)} discarded ${out.map(i=>C[i].n).join(', ')}.`);return out}
function takeFromDeck(p,id){const i=p.deck.lastIndexOf(id);if(i<0)return false;p.deck.splice(i,1);p.hand.push({id,uid:UID++});return true}
function takeFromDiscard(p,id){const i=p.discard.lastIndexOf(id);if(i<0)return false;p.discard.splice(i,1);p.hand.push({id,uid:UID++});return true}
const distinct=arr=>[...new Set(arr)];
function energyWant(pi){const p=D.p[pi];const us=[p.field[0],...benchOf(pi)].filter(Boolean);const need=us.find(u=>sparkNeed(u)<99&&!energyInHand(pi).some(h=>fits(h.id,u)));return need?EN_OF[C[need.id].type]:null}
function aiEnergyPick(pi,opts){const w=energyWant(pi);return (opts.find(o=>o.val===w)||opts.find(o=>units(pi).some(u=>fits(o.val,u))&&!isSpark(o.val))||opts.find(o=>isSpark(o.val))||opts[0]).val}
function aiEvoPick(pi,opts){const inPlay=units(pi);return opts.slice().sort((a,b)=>{const sa=inPlay.filter(u=>u.id===C[a.val].from).length*5+C[a.val].stage,sb=inPlay.filter(u=>u.id===C[b.val].from).length*5+C[b.val].stage;return sb-sa})[0].val}
const aiBest=opts=>opts.slice().sort((a,b)=>cardScore(b.val)-cardScore(a.val))[0].val;
async function searchDeck(pi,filter,title,aiPick,count){const p=D.p[pi];const got=[];for(let k=0;k<(count||1);k++){const ids=distinct(p.deck.filter(filter));const id=await choose(pi,title,`Search your deck${count>1?` (${k+1} of ${count})`:''}`,ids.map(i=>cardOpt(i)),aiPick||aiBest,count>1);if(!id)break;takeFromDeck(p,id);got.push(id)}
 shuffle(p.deck);log(got.length?`${pn(pi)} searched for ${isYou(pi)?got.map(i=>C[i].n).join(', '):got.length+' card'+(got.length>1?'s':'')}.`:`${pn(pi)} found nothing.`);return got}
function moveOptions(pi){const o=[];const us=units(pi);us.forEach(a=>{if(!a.sparks)return;us.forEach(b=>{if(b===a)return;const card=pickMovable(a,b);if(card!==false)o.push({from:a.uid,to:b.uid,label:`${C[a.id].n} → ${C[b.id].n}`,sub:`Moves ${card?C[card].n:'a bonus energy'}`,val:a.uid+':'+b.uid})})});return o}
function pickMovable(a,b){for(let i=a.en.length-1;i>=0;i--)if(fits(a.en[i],b))return a.en[i];return a.sparks>a.en.length?null:false}

function aiMovePick(pi,opts){const a=D.p[pi].field[0];const goodTo=o=>{const t=findUnit(+o.val.split(':')[1])[1],f=findUnit(+o.val.split(':')[0])[1];return (t===a?3:0)+(sparkNeed(t)<99?2:-3)+(sparkNeed(f)>=99&&f!==a?1:0)+(f===a?-2:0)};const best=opts.slice().sort((x,y)=>goodTo(y)-goodTo(x))[0];return goodTo(best)>0?best.val:null}
async function healPick(pi,n,title,cands){const id=await choose(pi,title,`Heal ${n}`,cands.map(u=>({label:C[u.id].n,sub:`${left(u)}/${hpOf(u)} HP`,art:artFor(u.id),val:u.uid})),opts=>opts.slice().sort((a,b)=>{const ua=findUnit(a.val)[1],ub=findUnit(b.val)[1];return (Math.min(n,ub.dmg)*2+(isActive(ub)?2:0)+unitValue(ub)/4)-(Math.min(n,ua.dmg)*2+(isActive(ua)?2:0)+unitValue(ua)/4)})[0].val);
 const u=id!=null&&findUnit(id)[1];if(u){const a=Math.min(n,u.dmg);u.dmg-=a;if(a)fx('heal',u.uid,a);return u}return null}
const otherCards=(pi,n)=>D.p[pi].hand.length>=n;
const nonApexS2=id=>isUnit(id)&&C[id].stage===2&&!isApex(id);
function trainerTargets(pi,id){const c=C[id];if(c.tg==='own')return units(pi);if(c.tg==='opp')return units(1-pi);if(c.tg==='oppbench')return benchOf(1-pi);if(c.tg==='ownlow')return units(pi).filter(u=>u.en.length<=1);if(c.tg==='oppen')return units(1-pi).filter(u=>u.en.length>0);if(c.tg==='oppbenchna')return benchOf(1-pi).filter(u=>!isApex(u.id));return null}

 if(c.kind==='ally'&&p.allyUsed)return 'You already played an Ally this turn.';

 switch(id){
  case 'charm':if(!p.discard.some(isUnit))return 'No Wildlings in your discard pile.';break;
  case 'growth':if(!p.deck.some(isBasic))return 'No Basic Wildlings left in your deck.';break;
  case 'rope':if(!units(pi).length)return 'No Wildling to recall.';break;
  case 'salvage':case 'bram':if(!p.discard.some(isEnergy))return 'No energy cards in your discard pile.';break;
  case 'rsatchel':if(!p.discard.some(isBasic))return 'No Basic Wildlings in your discard pile.';break;
  case 'exchange':case 'esatchel':case 'scache':if(others<1)return 'Needs another card in your hand to discard.';break;
  case 'sever':if(others<1)return 'Needs another card in your hand to discard.';break;
  case 'nia':case 'harness':if(!moveOptions(pi).length)return 'No energy can be moved between your Wildlings.';break;
  case 'fern':case 'kettle':if(!units(pi).some(u=>u.dmg>0))return 'None of your Wildlings is damaged.';break;
  case 'relay':if(!p.hand.some(h=>isUnit(h.id)&&C[h.id].stage===1))return 'Needs a Stage 1 Wildling in your hand to reveal.';break;
  case 'orin':if(!p.discard.some(nonApexS2)||!p.discard.some(isEnergy))return 'Needs a Stage 2 Wildling and an energy card in your discard pile.';break;
  case 'eguide':if(!units(pi).length)return 'You need a Wildling in play.';break;
  case 'power':if(others<1)return 'Needs another card in your hand to discard.';if(!o.field[0]||!o.field[0].en.length)return 'Your rival\'s active Wildling has no energy cards attached.';break;
  case 'migration':if(p.migrationUsed)return 'Forced Migration can only be played once per duel.';if(others<2)return 'Needs 2 other cards in your hand to discard.';break;

 const basics=ORDER.filter(id=>isBasic(id)&&types.includes(C[id].type)&&owned(id)).sort((a,b)=>(sc(b)+lineBonus(b))-(sc(a)+lineBonus(a)));

 // one evolution line per type first, then the best Basics

 for(const id of basics){if(cards.filter(isBasic).length>=bTarget)break;for(let k=0;k<4&&cards.filter(isBasic).length<bTarget;k++)add(id)}

function autofill(cards){

 const can=id=>(cnt[id]||0)<Math.min(limitOf(id),SAVE.coll[id]||0);const add=id=>{cards.push(id);cnt[id]=(cnt[id]||0)+1};
 const typeScore={};cards.filter(isUnit).forEach(id=>typeScore[C[id].type]=(typeScore[C[id].type]||0)+1);
 ORDER.filter(id=>SAVE.coll[id]&&isUnit(id)).forEach(id=>typeScore[C[id].type]=(typeScore[C[id].type]||0)+SAVE.coll[id]*.2);
 const top=Object.keys(typeScore).sort((a,b)=>typeScore[b]-typeScore[a]).slice(0,2);
 const pref=ORDER.filter(id=>isUnit(id)&&top.includes(C[id].type));
 // basics first, then their evolutions, then trainers, then anything
 for(const id of pref.filter(isBasic))while(cards.length<30&&can(id)&&cards.filter(isBasic).length<14)add(id);
 for(const id of pref.filter(isEvo))if(cards.includes(C[id].from))while(cards.length<22&&can(id)&&(cnt[id]||0)<2)add(id);
 for(const id of ['guide','tonic','cell','mix','taunt','ranger','hammer','growth','rope','charm'])while(cards.length<30&&can(id)&&(cnt[id]||0)<3)add(id);
 for(const id of ORDER)while(cards.length<30&&can(id)&&(!isEvo(id)||cards.includes(C[id].from)))add(id);
 return cards;
}

  case 'add':{const E=UI.edit,id=ds.id;const n=E.cards.filter(x=>x===id).length;const L=isExtra(id)?limitOf(id):Math.min(limitOf(id),SAVE.coll[id]||0);if(n>=L){toast(n>=4?`Max ${limitOf(id)} copies of ${C[id].n}.`:'You don\'t own more copies.');return}if(E.cards.length>=DECK){toast(`Deck is full (${DECK} cards).`);return}E.name=$('#deckname').value;E.cards.push(id);render();break}

  case 'cbuild':{const E=UI.edit,C2=UI.coach;E.name=$('#deckname').value;const A=analyzeDeck(E.cards);const t=C2.types.length?C2.types:A.types.slice(0,2);if(!t.length){toast('Pick at least one type.');return}

  case 'pile':{const p=D.p[+ds.p];modal(`<div class="row"><h2 style="flex:1">${+ds.p===0?'Your':p.name+'\'s'} discard pile</h2><button class="btn ghost sm" data-act="close">Close</button></div>${p.discard.length?`<div class="grid" style="--gw:120px">${p.discard.map(id=>cardHTML(id)).join('')}</div>`:'<p class="muted">Empty.</p>'}`);break}

  case 'hand':{if(!D||D.turn!==0||D.busy||D.over)return;const uid=+ds.uid;const me=D.p[0];const h=me.hand.find(x=>x.uid===uid);if(!h)return;D.snipe=null;

    else{D.sel=null;render()}}
   else{D.sel=uid;render()}break}

  case 'unit':{if(!D)return;const uid=+ds.uid;const [pi,u]=findUnit(uid);if(!u)return;const my=D.turn===0&&!D.busy&&!D.over;
   if(my&&D.snipe&&pi===1){const s=D.snipe;D.snipe=null;if(await attack(0,s.uid,s.i,uid)){if(!D.over)await endTurn()}else{D.busy=false;render()}return}

   D.sel=null;unitSheet(u,pi);render();break}
  case 'land':landSheet(+ds.p);break;

   if(m.fx&&m.fx.snipe&&units(1).length>1){D.snipe={uid,i};render();return}
   if(await attack(0,uid,i)){if(!D.over)await endTurn()}else{D.busy=false;render()}break}
  case 'choice':{const c=CHOICE;if(!c)break;CHOICE=null;closeModal();c.res(c.opts[+ds.i].val);break}

 }
